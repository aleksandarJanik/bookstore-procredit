name: bookstore

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_SA_Password123!}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_SA_Password123!}
      BOOKSTORE_DB_PASSWORD: ${BOOKSTORE_DB_PASSWORD:-Bookstore_Local123!}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-Keycloak_Local123!}
    volumes:
      - ./infrastructure/sql:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    depends_on:
      sql-init:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin_Local123!}
      KC_DB: mssql
      KC_DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=KeycloakDb;encrypt=false;trustServerCertificate=true
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-Keycloak_Local123!}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/bookstore-realm.json:/opt/keycloak/data/import/bookstore-realm.json:ro

  api:
    build:
      context: .
      dockerfile: backend/Bookstore.Api/Dockerfile
    depends_on:
      sql-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Bookstore: Server=sqlserver,1433;Database=BookstoreDb;User Id=bookstore_app;Password=${BOOKSTORE_DB_PASSWORD:-Bookstore_Local123!};TrustServerCertificate=True
      Authentication__Authority: http://localhost:8080/realms/bookstore
      Authentication__MetadataAddress: http://keycloak:8080/realms/bookstore/.well-known/openid-configuration
      Authentication__Audience: bookstore-api
      Authentication__RequireHttpsMetadata: "false"
      ManagementClient__ApiBaseUrl: http://localhost:8080
      ManagementClient__TokenEndpoint: http://keycloak:8080/realms/bookstore/protocol/openid-connect/token
      ManagementClient__ClientId: bookstore-service
      ManagementClient__ClientSecret: bookstore-service-local-secret
      Swagger__Enabled: "true"
      Database__ApplyMigrations: "true"
      Database__SeedData: "true"
      Cors__AllowedOrigins__0: http://localhost:4201
    ports:
      - "5000:8080"

  ui:
    build:
      context: .
      dockerfile: frontend/bookstore-ui/Dockerfile
    depends_on:
      - api
    ports:
      - "4201:8080"

volumes:
  sql-data:
